name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Docker is available for Testcontainers
        run: docker info

      - name: Build and Test with Maven
        env:
          TESTCONTAINERS_CHECKS_DISABLE: "true"
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
        # -e  = print full exception stack traces so errors are visible in the log
        # -fae = fail at end (run all modules, collect all errors)
        run: ./mvnw verify -B -e -fae --no-transfer-progress

      # Print every surefire report inline so the error is visible
      # directly in the Actions log without downloading anything
      - name: Print test failure details
        if: failure()
        run: |
          echo "====== SUREFIRE REPORTS ======"
          find target/surefire-reports -name "*.txt" 2>/dev/null | while read f; do
            echo ""
            echo "--- $f ---"
            cat "$f"
          done
          echo ""
          echo "====== COMPILATION ERRORS (if any) ======"
          find . -name "*.class" -newer pom.xml 2>/dev/null | head -5 || true

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7