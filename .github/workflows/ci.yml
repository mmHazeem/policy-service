name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Docker is available for Testcontainers
        run: docker info

      - name: Build and Test with Maven
        env:
          # Testcontainers uses this to skip the cloud lookup for Docker host
          TESTCONTAINERS_CHECKS_DISABLE: "true"
          # JWT secret — must match src/test/resources/application.yaml
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
        run: ./mvnw verify -B --no-transfer-progress

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
